name: Smoke dry run (staging)

# The browser part of docs/launch/prod-smoke.md (sections 3 to 6 and the account deletion in 8), run by hand against
# staging or another preview that offers "Continue as test user": sign up as a fresh test user, upload the synthetic
# resume, Gaps and Path, Today, Map, download the data, sign out and in again, then delete the account
# (scripts/smoke/staging-dry-run.mjs). One line per step in the log; any failed step turns the run red.
# The upload and the gaps call the real Claude API on that deployment, so a run spends a few cents of its budget.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Preview to check; it must offer Continue as test user"
        required: true
        default: "https://careermetro-git-staging-career-metro.vercel.app"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser
        # Not a project dependency: only the e2e job and this one need it.
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Walk prod-smoke.md on the preview
        env:
          # Passed through env, never pasted into the script line, so the input can't run as shell.
          BASE: ${{ inputs.url }}
          # Sent only to that site, as x-vercel-protection-bypass; never printed.
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SMOKE_SHOTS: smoke-results
        run: node scripts/smoke/staging-dry-run.mjs
      - name: Keep screenshots of failed steps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-staging-results
          path: smoke-results/
          if-no-files-found: ignore
          retention-days: 3
