name: Mine job postings

# Reads public Greenhouse, Lever and Ashby job boards and measures how often each skill appears per role.
# On main, results (aggregate counts, titles and links only) are pushed to the data/jd-snapshot branch. A run on any
# other branch only uploads them as a workflow artifact, so a branch experiment never replaces main's snapshot.
# Main runs monthly (03:00 UTC on the 1st) and by hand. It no longer counts /market openings: the monthly Lever and
# Greenhouse count was retired (docs/plans/market-trends-plan.md, PR 3, D4) for the daily Departures feed's rollup.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["scripts/jd-mining/**"]

permissions:
  contents: write

# One group per branch. A new push to a branch replaces that branch's running experiment; runs on main (scheduled or
# manual) queue and are never cancelled. Branch runs write no shared branch, so they can't race main's.
concurrency:
  group: jd-mining-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  mine:
    runs-on: ubuntu-latest
    env:
      ON_MAIN: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/jd-mining/mine.mjs "$RUNNER_TEMP/jd-snapshot"
      - name: Keep a branch run's results as an artifact
        if: env.ON_MAIN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jd-snapshot
          path: ${{ runner.temp }}/jd-snapshot/
          retention-days: 14
      - name: Push results to the data/jd-snapshot branch
        if: env.ON_MAIN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/jd-snapshot"
          # This branch holds data only, so tell Vercel not to build a preview for it.
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b data/jd-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Job posting snapshot $(date -u +%F) from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data/jd-snapshot
