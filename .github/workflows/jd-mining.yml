name: Mine job postings

# Reads public Greenhouse, Lever and Ashby job boards and measures how often each skill appears per role.
# Results (aggregate counts, titles and links only) are pushed to the data/jd-snapshot branch.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["scripts/jd-mining/**"]

permissions:
  contents: write

concurrency:
  group: jd-mining
  cancel-in-progress: true

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/jd-mining/mine.mjs "$RUNNER_TEMP/jd-snapshot"
      - name: Push results to the data/jd-snapshot branch
        run: |
          cd "$RUNNER_TEMP/jd-snapshot"
          # This branch holds data only, so tell Vercel not to build a preview for it.
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b data/jd-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Job posting snapshot $(date -u +%F) from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data/jd-snapshot
