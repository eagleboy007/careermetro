name: Link check

# Checks every link in the resource catalog. On pull requests it fails on a dead link. The daily run records results
# in the database instead (needs the repository secret DATABASE_MIGRATION_URL), so new paths skip dead links.
on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  pull_request:
    paths: ["src/content/resources.json", "scripts/check-links.mjs", ".github/workflows/links.yml"]
  workflow_dispatch:

concurrency:
  group: links-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check links
        env:
          # Only the scheduled run on main writes to the database.
          DATABASE_URL: ${{ github.event_name == 'schedule' && secrets.DATABASE_MIGRATION_URL || '' }}
        run: node scripts/check-links.mjs
