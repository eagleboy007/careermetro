name: Migrate database

# Applies pending Drizzle migrations, then loads skills and role profiles, after a merge to main.
# Needs the repository secret DATABASE_MIGRATION_URL (Supabase session pooler, port 5432).
on:
  push:
    branches: [main]
    paths: ["drizzle/**", "src/content/**", "scripts/seed-content.mjs"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
    steps:
      - name: Skip when the database secret is not set yet
        if: env.DATABASE_URL == ''
        run: echo "::warning::DATABASE_MIGRATION_URL is not set; skipping migrations."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.DATABASE_URL != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.DATABASE_URL != ''
      - name: Check the database link
        if: env.DATABASE_URL != ''
        run: node scripts/check-database-url.mjs
      # Before: report only, so the log shows what Supabase's API could reach before this run's migrations.
      - name: Report tables without row level security (before)
        if: env.DATABASE_URL != ''
        continue-on-error: true
        env:
          CHECK_RLS_STAGE: before migrations
        run: node scripts/check-rls.mjs
      - run: npm run db:migrate
        if: env.DATABASE_URL != ''
      - run: npm run db:seed
        if: env.DATABASE_URL != ''
      - name: Check every public table has row level security
        if: env.DATABASE_URL != ''
        env:
          CHECK_RLS_STAGE: after migrations
        run: node scripts/check-rls.mjs
