name: Update staging

# Keeps the `staging` branch equal to main, so the fixed staging address (Vercel's alias for the `staging` branch,
# see docs/staging.md) always shows the newest build as a preview: signed-in screens and "Continue as test
# user" included. When main differs from staging only in files the build doesn't use (the same list as
# scripts/vercel-ignore.sh), staging isn't moved, so no Vercel deployment is made; the next code merge moves it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The push below uses the token the checkout saves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      # Always main, even when run by hand from another branch.
      - name: Move staging to main
        run: |
          if git fetch --depth=1 origin staging 2>/dev/null && git diff --quiet FETCH_HEAD HEAD -- . ':(exclude)docs' ':(exclude,glob)*.md' ':(exclude)fixtures/evals' ':(exclude)e2e' ':(exclude)scripts/smoke' ':(exclude).github'; then
            echo "Only docs, evals, tests or workflows changed since staging; leaving it where it is."
          else
            git push --force origin HEAD:refs/heads/staging
          fi
