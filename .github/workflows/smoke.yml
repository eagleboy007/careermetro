name: Smoke check

# After Vercel finishes a production deploy, open /api/health on it. A red run means the live site
# can't reach the database or Claude (for example a missing key or an empty credit balance).
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Site to check, for example https://careermetro.vercel.app"
        required: true
      check:
        description: "Optional deeper check, for example parse (runs the real resume-parse request on a synthetic resume)"
        required: false

permissions:
  contents: read

jobs:
  health:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        env:
          # The public domain, which Vercel Deployment Protection doesn't cover. PRODUCTION_URL (a repository variable) overrides it.
          SITE: ${{ inputs.url || vars.PRODUCTION_URL || 'https://careermetro.vercel.app' }}
          # Only needed if Vercel Deployment Protection covers the URL above.
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CHECK: ${{ inputs.check }}
          # The parse check spends from the upload budget, so the site only runs it for the cron secret.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # A parse check is slow and cached server-side, so retrying it only waits for the same answer.
          RETRIES=2; if [ -n "$CHECK" ]; then RETRIES=0; fi
          headers=()
          if [ -n "$BYPASS" ]; then headers=(-H "x-vercel-protection-bypass: $BYPASS"); fi
          if [ -n "$CHECK" ] && [ -n "$CRON_SECRET" ]; then headers+=(-H "authorization: Bearer $CRON_SECRET"); fi
          code=$(curl -sS --max-time 120 --retry "${RETRIES}" --retry-all-errors "${headers[@]}" -o health.json -w "%{http_code}" "${SITE%/}/api/health${CHECK:+?check=$CHECK}" || true)
          body=$(head -c 1000 health.json 2>/dev/null)
          if [ "$code" = 401 ] && [ -n "$CHECK" ] && [ -z "$CRON_SECRET" ]; then
            body="HTTP 401: the parse check needs the CRON_SECRET repository secret (the same value as in Vercel), unless Vercel Deployment Protection blocked it."
          elif [ "$code" = 401 ] || [ "$code" = 403 ]; then
            body="Vercel Deployment Protection blocked the check. Set the PRODUCTION_URL variable or the VERCEL_AUTOMATION_BYPASS_SECRET secret."
          fi
          echo "HTTP $code: ${body//::/: :}"
          echo "Health of ${SITE}: HTTP $code: $body" >> "$GITHUB_STEP_SUMMARY"
          # An annotation, so the result can be read from the checks API without downloading logs.
          esc=${body//'%'/'%25'}; esc=${esc//$'\r'/'%0D'}; esc=${esc//$'\n'/'%0A'}
          if [ "$code" = 200 ]; then echo "::notice title=Health::HTTP $code: $esc"; else echo "::error title=Health::HTTP $code: $esc"; exit 1; fi
