name: Departures board check

# Checks the candidate job boards Data research collected (scripts/departures/board-candidates.csv) before they go on
# the reviewed list (src/content/job-boards.json). One public GET per board, through the same job-board API address,
# timeout, size cap and no-redirect rule as the daily feed (Greenhouse, Lever, Ashby and SmartRecruiters only; never a
# web page). It writes nothing to any database and uses no secret. The log names boards and counts only.
#
# The boards that answer 200 with at least one India post are uploaded as board-check-passing.json, ready-to-paste
# job-boards.json entries. Adding them is still a reviewed PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the candidate boards
        run: node scripts/departures/check-boards.mjs scripts/departures/board-candidates.csv board-check-passing.json
      - name: Upload the passing boards
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: board-check-passing
          path: board-check-passing.json
          if-no-files-found: warn
          retention-days: 14
