name: Scale check

# About 10,000 synthetic members in the CI job's own PostgreSQL, then each main signed-in page and each cron in
# vercel.json timed against a production build, with EXPLAIN ANALYZE on the key queries (docs/scale-check.md). Fails
# when a page's p95 passes 2.5 s or a cron passes 80% of its Hobby maxDuration. It runs when the scale scripts or this
# workflow change, and by hand. Never against staging or production: those runs come later, wired on their own.
on:
  pull_request:
    paths:
      - scripts/scale/**
      - .github/workflows/scale.yml
  workflow_dispatch:
    inputs:
      members:
        description: "Synthetic members to seed"
        required: false
        default: "10000"
      runs:
        description: "Timed runs per page and member, after a first visit"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start PostgreSQL
        run: bash scripts/ci-postgres.sh
      # pg_stat_statements lists the slowest statements the pages and crons send; it needs a preload and a restart.
      - name: Load pg_stat_statements
        # Only the library: its own settings are unknown to ALTER SYSTEM until it is loaded, and track = 'top' is the default.
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -q -c "alter system set shared_preload_libraries = 'pg_stat_statements'"
          sudo systemctl restart postgresql.service
          for i in $(seq 20); do pg_isready -h localhost -p 5432 -q && break; sleep 1; done
          pg_isready -h localhost -p 5432
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      # Built as a preview, like the e2e walk, so the test sign-in the timings use is on.
      - run: npm run build
        env:
          VERCEL_ENV: preview
      - name: Seed the synthetic members
        env:
          SCALE_MEMBERS: ${{ inputs.members || '10000' }}
        run: node scripts/scale/seed.mjs
      - name: Time pages and crons
        env:
          VERCEL_ENV: preview
          ANTHROPIC_API_KEY: sk-e2e
          ANTHROPIC_BASE_URL: http://127.0.0.1:4011
          # The same test-only values as the e2e walk (ci.yml).
          PHONE_KEY: e2e-only-phone-key
          FIND_REF_KEY: e2e-only-find-ref-key
          NAME_HASH_KEY: e2e-only-name-hash-key
          CRON_SECRET: e2e-only-cron-secret
          # The weekly email and the digest run their whole send path; scripts/scale/resend-stub.mjs answers for Resend,
          # so nothing is sent. Test-only values.
          RESEND_API_KEY: re_scale_stand_in
          EMAIL_FROM: "CareerMetro <codes@example.invalid>"
          BASE: http://localhost:3211
          RUNS: ${{ inputs.runs || '5' }}
        run: |
          node e2e/mock-ai.mjs > scale-mock-ai.log 2>&1 &
          NODE_OPTIONS="--import=file://$PWD/scripts/scale/resend-stub.mjs" npx next start -p 3211 > scale-server.log 2>&1 &
          for i in $(seq 60); do curl -sf "$BASE/" > /dev/null && break; sleep 1; done
          curl -sf "$BASE/" > /dev/null || { echo "The app did not start"; tail -50 scale-server.log; exit 1; }
          node scripts/scale/time.mjs
      - name: Clean up the synthetic members
        if: ${{ !cancelled() }}
        run: node scripts/scale/cleanup.mjs
      - name: Keep the report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scale-results
          path: |
            scripts/scale/results/
            scale-server.log
            scale-mock-ai.log
          retention-days: 7
