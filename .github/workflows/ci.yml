name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only reads the code. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for tests that need real SQL (src/lib/resume/ingest.test.ts).
      postgres:
        # Official image via its public ECR mirror, so CI is not stopped by Docker Hub pull limits.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Apply migrations to the test database
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  # Walks the whole app in a real browser against a production build, signed-in screens included (e2e/README.md).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - name: Install the browser
        # Not a project dependency: only this job needs it.
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Walk the app
        env:
          VERCEL_ENV: preview
          ANTHROPIC_API_KEY: sk-e2e
          ANTHROPIC_BASE_URL: http://127.0.0.1:4011
          # next start runs as production, where a shared phone needs its own key (corporate build step 6). Test-only value.
          PHONE_KEY: e2e-only-phone-key
          # The walk calls the daily clean-up the way Vercel Cron does (corporate build step 7). Test-only value.
          CRON_SECRET: e2e-only-cron-secret
          BASE: http://localhost:3211
        run: |
          node e2e/mock-ai.mjs > e2e-mock-ai.log 2>&1 &
          npx next start -p 3211 > e2e-server.log 2>&1 &
          for i in $(seq 60); do curl -sf "$BASE/api/health" > /dev/null && break; sleep 1; done
          curl -sf "$BASE/api/health" > /dev/null || { echo "The app did not start"; cat e2e-server.log; exit 1; }
          node e2e/walk.mjs
      - name: Keep screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            e2e/results/
            e2e-server.log
            e2e-mock-ai.log
          retention-days: 7
