name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only reads the code. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start PostgreSQL
        run: bash scripts/ci-postgres.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Apply migrations to the test database
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      # GitHub's advisory database lists new advisories before npm audit's does (Next 16.4.0's, 2026-10).
      - name: Check runtime dependencies against GitHub's advisories
        run: node scripts/check-advisories.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Walks the whole app in a real browser against a production build, signed-in screens included (e2e/README.md).
  e2e:
    runs-on: ubuntu-latest
    # The walk takes about 6 minutes; a slow apt mirror during the browser install has taken 8.
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start PostgreSQL
        run: bash scripts/ci-postgres.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      # Built as the walk runs it (a preview, like staging), so pages rendered at build and at request agree.
      - run: npm run build
        env:
          VERCEL_ENV: preview
      - name: Install the browser
        # Not a project dependency: only this job needs it.
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Walk the app
        id: walk
        env:
          VERCEL_ENV: preview
          ANTHROPIC_API_KEY: sk-e2e
          ANTHROPIC_BASE_URL: http://127.0.0.1:4011
          # next start runs as production, where a shared phone needs its own key (corporate build step 6). Test-only value.
          PHONE_KEY: e2e-only-phone-key
          # Find people's opaque ids need their own key in production too, never CRON_SECRET (pending item 19). Test-only value.
          FIND_REF_KEY: e2e-only-find-ref-key
          # Work-email codes and invites are hashed with NAME_HASH_KEY, never CRON_SECRET; without it production turns
          # them off (security review 2026-10-13). Test-only value.
          NAME_HASH_KEY: e2e-only-name-hash-key
          # The walk calls the daily clean-up the way Vercel Cron does (corporate build step 7). Test-only value.
          CRON_SECRET: e2e-only-cron-secret
          BASE: http://localhost:3211
        run: |
          node e2e/mock-ai.mjs > e2e-mock-ai.log 2>&1 &
          npx next start -p 3211 > e2e-server.log 2>&1 &
          for i in $(seq 60); do curl -sf "$BASE/api/health" > /dev/null && break; sleep 1; done
          curl -sf "$BASE/api/health" > /dev/null || { echo "The app did not start"; cat e2e-server.log; exit 1; }
          node e2e/walk.mjs
      # T150: one synthetic member with every list full and every text at its cap (e2e/max-data/seed.run.ts), then each
      # signed-in page at 390 and 1280 px in light and dark (e2e/oversize.mjs): sideways spill, page height, PDF time.
      # Runs when the walk ran, pass or fail, so a broken walk step doesn't hide a spill. About 3 minutes.
      - name: Oversize check with the max-data member
        id: oversize
        if: ${{ !cancelled() && (steps.walk.outcome == 'success' || steps.walk.outcome == 'failure') }}
        timeout-minutes: 10
        env:
          VERCEL_ENV: preview
          ANTHROPIC_API_KEY: sk-e2e
          ANTHROPIC_BASE_URL: http://127.0.0.1:4011
          # The same test-only values as the walk, for the app if it has to be started again here.
          PHONE_KEY: e2e-only-phone-key
          FIND_REF_KEY: e2e-only-find-ref-key
          NAME_HASH_KEY: e2e-only-name-hash-key
          CRON_SECRET: e2e-only-cron-secret
          BASE: http://localhost:3211
        run: |
          # The walk step's app keeps running into this step; start it again only if it stopped.
          if ! curl -sf "$BASE/api/health" > /dev/null; then
            node e2e/mock-ai.mjs >> e2e-mock-ai.log 2>&1 &
            npx next start -p 3211 >> e2e-server.log 2>&1 &
            for i in $(seq 60); do curl -sf "$BASE/api/health" > /dev/null && break; sleep 1; done
            curl -sf "$BASE/api/health" > /dev/null || { echo "The app did not start"; tail -50 e2e-server.log; exit 1; }
          fi
          MAX_DATA_ACTION=seed npx vitest run --config vitest.max-data.config.ts
          # Removes the member at the end, after a failure too.
          node e2e/oversize.mjs
      - name: Keep the oversize screenshots
        if: ${{ !cancelled() && steps.oversize.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oversize-screenshots
          path: e2e/results/oversize/
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            e2e/results/
            e2e-server.log
            e2e-mock-ai.log
          retention-days: 7
